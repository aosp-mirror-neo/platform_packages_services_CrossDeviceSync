syntax = "proto3";

package com.android.crossdevicesync.proto;

// Metadata of a document.
// Next ID: 3
message DocumentMetadata {
  // Schema version of this document.
  int32 schema_version = 1;

  // Per-path metadata.
  repeated RecordMetadata record_metadata = 2;
}

// Metadata of a data record in a document.
// Next ID: 3
message RecordMetadata {
  // Path of the data record.
  string path = 1;

  // The id of the device that last modified this record.
  optional string last_modified_device_node_id = 2;
}
