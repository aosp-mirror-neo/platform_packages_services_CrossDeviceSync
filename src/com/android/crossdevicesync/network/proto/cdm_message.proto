syntax = "proto3";

package com.android.crossdevicesync.network.proto;

// A batched message format that groups multiple messages and multiple ACKs together.
message BatchedMessage {
    // List of outgoing messages.
    repeated Message messages = 1;
    // List of message ACKs as responses to incoming messages.
    repeated uint64 ack_ids = 2;
    // Instance id of the sender. Should change if sender restarts. This is needed to reset the
    // receiver side cache in case the sender restarts or crashes.
    uint64 sender_instance_id = 3;
}

// A message to send or receive from CompanionDeviceManager
// Next ID: 3
message Message {
    // Sender side message handle id. This should be monotonically increasing for each new message.
    uint64 handle_id = 1;
    // The network this message belongs to.
    string network_id = 2;
    // The message payload.
    bytes payload = 3;
}