# go/agcp/tools/repohooks/

[Builtin Hooks]
aidl_format = true
bpfmt = true
google_java_format = true
xmllint = true
ktfmt = true

[Builtin Hooks Options]
ktfmt = --kotlinlang-style

[Hook Scripts]
checkstyle_hook = ${REPO_ROOT}/prebuilts/checkstyle/checkstyle.py --sha ${PREUPLOAD_COMMIT} --sha ${PREUPLOAD_COMMIT} --config_xml checkstyle.xml

ktlint_hook = ${REPO_ROOT}/prebuilts/ktlint/ktlint.py --no-verify-format --file ${PREUPLOAD_FILES}

alint_hook = ${REPO_ROOT}/vendor/google/tools/alint
